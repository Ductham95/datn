
# Cách dùng:
#   1. Copy file .env.example thành .env.production và điền giá trị
#   2. Chạy: docker compose --env-file .env.production up --build -d

services:
  # ==================== DATABASE ====================
  db:
    image: timescale/timescaledb-ha:pg15
    container_name: datn_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datn_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality_db}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network

  # ==================== BACKEND ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datn_backend
    restart: always
    env_file: .env.production
    depends_on:
      - db
    networks:
      - app-network

  # ==================== NGINX (Frontend + Reverse Proxy) ====================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: datn_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
