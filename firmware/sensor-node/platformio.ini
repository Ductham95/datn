; PlatformIO Configuration - Air Quality Sensor Node (FreeRTOS)
; Board: ESP32 DevKit V1 + LoRa SX1278 + PMS7003 + CCS811 + DHT22

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; === Library Dependencies ===
lib_deps =
    sandeepmistry/LoRa@^0.8.0
    fu-hsi/PMS Library@^1.1.0
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; === Build Flags ===
build_flags =
    -DCORE_DEBUG_LEVEL=3          ; Log level: 0=None, 3=Info, 5=Verbose
    -DBOARD_HAS_PSRAM=0
